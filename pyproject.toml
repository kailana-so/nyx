[project]
name = "nyx"
version = "0.1.0"
description = "Local-first AI development assistant"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.50",
    "pypdf>=5.0",
]

[project.scripts]
nyx = "nyx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "pyright"]
